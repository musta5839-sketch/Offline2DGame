name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;34.0.0"

      - name: Verify environment
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Build APK
        run: ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Check APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Test APK archive
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Generate SHA-256
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          cat app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline2DGame-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
